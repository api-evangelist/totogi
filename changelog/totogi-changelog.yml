- date: '2026-04-15'
  title: Built-in Lightweight Policy Management
  category: charging engine
  breaking: false
  highlights:
  - Adds native 5G policy control (PCF) over Npcf_SMPolicyControl (N7) and 4G policy control (PCRF) over Gx via a built-in Diameter adapter.
  - Evolves CaaS from an OCS/CHF into a converged Charging + Policy solution with no external PCF/PCRF dependency.
  - Session-level QoS negotiation, event-driven dynamic policy updates, policy event exposure.
  - Policy rules are configured in Plan Design; charging counters behave as if the PCF were integrated over N28.
