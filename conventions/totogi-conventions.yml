idempotency:
  supported: true
  mechanism: caller-supplied transaction id
  parameter: transactionId
  location: mutation input object
  type: ID
  required: false
  server_generated_when_absent: true
  conflict_error: TransactionHasBeenProcessed
  description: >-
    Totogi CaaS implements idempotency as a first-class, documented contract on its mutations.
    Balance and account mutations accept an optional transactionId in the input; replaying a
    mutation with a transactionId the platform has already seen returns the typed error
    TransactionHasBeenProcessed (which itself carries providerId and transactionId) instead of
    applying the change twice. When the caller omits transactionId, Totogi generates one and
    returns it on the payload so the transaction can still be correlated with upstream systems.
  evidence:
  - >-
    CreateBalanceInput.transactionId — "An optional transaction ID to ensure idempotency of the
    API call, allowing for transaction correlation between Totogi and upstream systems. If not
    provided, Totogi automatically generates a unique identifier for each transaction"
  - >-
    BalancePayload.transactionId — "The transaction ID returned as a result of the createBalance
    API call. This ID ensures idempotency and allows for the correlation of transactions between
    Totogi and upstream systems."
  - >-
    TransactionHasBeenProcessed is a member of the CreateAccount, CreateBalance, DeleteAccount,
    UpdateAccount and UpdateBalance result unions.
  retention: not published
