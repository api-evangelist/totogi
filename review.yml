    registry: RubyGems
    version: 0.1.5
    url: https://rubygems.org/gems/whoosh-ruby
    note: '"The official library for communicating with the Whoosh REST API."'
  - language: Java
    package: whoosh-0.1.0-jar-with-dependencies.jar
    registry: GitHub Releases
    url: https://github.com/totogi/whoosh-java-releases
    note: Standalone JAR, no Maven Central coordinate found.
  graphql:
    found: true
    correctedOn: '2026-07-25'
    docs: https://docs.api.totogi.com/
    generator: SpectaQL
    schemaGeneratedAt: '2026-07-23T22:13:14Z'
    endpoints:
    - https://gql.produseast1.api.totogi.com/graphql
    - https://gql.prodapsoutheast1.api.totogi.com/graphql
    - https://api.totogi.io/graphql
    legacyDocs: https://apis.totogi.solutions/ccab/
    legacyEndpoint: https://api.ccab.totogi.com/graphql
    queries: 32
    mutations: 61
    typeDefinitions: 480
    subscriptions: 0
    introspection: gated
    introspectionEvidence: >-
      POST {__schema{queryType{name}}} to https://api.totogi.io/graphql returns HTTP 401
      UnauthorizedException "Valid authorization header not provided." — the AWS AppSync
      signature. The live schema cannot be introspected anonymously, but the full documented
      schema is public, so the SDL in graphql/totogi-charging-as-a-service.graphql was
      reconstructed from the rendered reference rather than from introspection.
    note: >-
      The first pass recorded graphql.found=false. That was a miss, not an absence — see
      review.revisionNote.
  grpc:
    found: false
  postman:
    found: false
  agentReadiness:
    llmsTxt: true
    note: |
      Totogi publishes an unusually complete agent-facing content layer that is worth
      recording even though none of it is an API: llms.txt, llms-full.txt, and four
      canonical JSON documents linked from the site footer as "AI Index" —
      facts.json, evidence.json, glossary.json, and case-studies.json. robots.txt
      explicitly grants full access to GPTBot, ChatGPT-User, CCBot, PerplexityBot,
      AnthropicAI, ClaudeBot, and Applebot while restricting traditional search
      crawlers from /product-updates/. A telecom vendor that machine-readably
      publishes its own facts and evidence but keeps its API reference behind a
      Redocly login is a precise illustration of the sector split.
