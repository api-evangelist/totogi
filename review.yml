actions:
  openapiDirectoryCreated: false
  reason: |
    No parseable OpenAPI or Swagger document was retrievable from any Totogi-owned
    host. The only candidate that returned HTTP 200 for a spec-shaped path
    (docs.totogi.solutions/openapi.yaml) served the Redocly login HTML, not a
    specification. Rather than harvest a placeholder, the openapi/ directory is
    omitted entirely.
  apisYmlApisListed: 2
  apisYmlNote: |
    Whoosh Programmable Messaging API is listed with its real public docs URL and
    documented base path. Totogi Charging-as-a-Service is listed as a real, named
    API product whose reference is behind a Redocly login wall, with no baseURL
    asserted because none is public.
