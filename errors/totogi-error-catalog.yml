    has no states. At least one state is required. DuplicateCounterStateName - Two or more counter states
    in a counter have the same name. MissingDefaultCounterState - A counter has no default state (a state
    with no threshold). DuplicateCounterStateThreshold - Two or more states of a counter have the same
    threshold. WrongCountryCodeExpression - The country code expression defines a non-restricting value
    set. RoamingConfigOverlapping - The roaming configuration includes overlapping entries. A start (
    ) includes all countries, having an entry with " " and one with "US" is overlapping "*" needs to be
    replaced with "!US". LongDistanceConfigOverlapping - The long distance configuration includes overlapping
    entries. A start ( ) includes all countries, having an entry with " " and one with "US" is overlapping
    "*" needs to be replaced with "!US". TooManyEntries - The entry list for the roaming and long distance
    configuration has too many entries. 10k entries is the maximum. PlanServiceAllowanceIsUnlimited -
    If "periodAllowance" is not provided, the plan service is considered unlimited. "overage" is not needed.
