"""Return type of MakePlanVersionAssignable and MakePlanVersionNotAssignable including all possible errors. PlanVersionNotFound (PlanVersionNotFound) - The requested plan version with the provided ID cannot be found. MigrationAlreadyInProgress (MigrationAlreadyInProgress) - Another migration on the same plan can be done only when the current migration is finished. PlanVersionWrongTransition (PlanVersionIsAlreadyInState) - The plan version is already in the correct state. Transition is not required. PlanVersionWrongTransition (PlanVersionIsAlreadyInState) - The plan version is already archived and can not move to suspended anymore. PlanVersionWrongTransition (PlanVersionCanNotBeAvailable) - The state of a plan version can be changed to available only if it is in suspended or deployed state. PlanVersionWrongTransition (PlanVersionCanNotBeSuspended) - The state of a plan version can be changed to suspended only if it is in available or deployed state. PlanVersionWrongTransition (PlanAliasUsesVersions) - The plan version is part of a plan alias and other versions of the plan alias that would be made unassignable are either in use or will be in use by the alias. InternalServerError (ChargeEngineNotAvailable) - The charge engine is not available at this time."""
union AssignablePlanVersionResult = PlanVersionPayload | PlanVersionNotFound | PlanVersionWrongTransition | InvalidProviderLifecycleStage | RateLimitExceeded | InternalServerError


