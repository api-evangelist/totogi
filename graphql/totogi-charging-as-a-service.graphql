  """Once you have defined a new Field Mapping , you can call deployFieldMappings and specify the path of the field mapping you want to deploy. By providing a from date, you can specify a point in the future when current set of field mappings will take effect, e.g. the first of the coming month for the field mapping to become active. If you omit the from date, immediate activation is performed. The process to deploy an updated field mapping is equivalent to a new one. You specify the path of the field mapping you want to deploy and this specific mapping will be updated. Any other deployed mappings remain untouched. If you provide a list of paths , this set of field mappings will be deployed. Any other deployed mappings remain unchanged. To remove a deployed Field Mapping: - Delete the Field Mapping from the draft using deleteFieldMapping . - Next invoke the deployFieldMappings without providing the paths parameter. - This operation will deploy only the field mappings that are specified in the draft. - If a from date is not provided, the current time is used as the default from date. - Any existing field mappings not in the draft will be removed with the following limitations. When existing field mappings are deleted, the system checks if the from date of the existing mapping is earlier than the from date specified for the new mapping. If it is, the deleted mapping is re-added. So to completely delete a deployed field mapping, you should provide a from date that matches or precedes the from date used in the prior deployment of the field mapping you wish to remove. Authorized Roles: Network_Admin."""
