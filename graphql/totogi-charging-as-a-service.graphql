"""Input type of KeyValue. This type is used in overrides which are key value pairs which can be nested. There are two main levels: plan and plan service. A simple plan override is the following: { name: "recurring period", value: "HOUR" } A nested override is used for plan services and can be like the following: "{ name: \"TemplateService0\", value: {\"recurring units":\"120\"} }" Pay attention to the format, it is a JSON, but as an escaped string because only strings are allowed as values. The same applies to inner values, such as recurring units, it must be also a string. A nested override uses the override field and value as the high-level value field with value. The following override fields are valid: Field ReferencedField Type Scope Format alignToBillingDoM ProratingOptionsInput. alignToBillingDoM BOOLEAN Plan old and new fee fee NUMBER Plan old renewalFee fee NUMBER Plan new first usage fee firstUsageFee NUMBER Plan old firstUsageFee firstUsageFee NUMBER Plan new number of periods RecurringPeriodInput. numberOfPeriods NUMBER Plan old numberOfPeriods RecurringPeriodInput. numberOfPeriods NUMBER Plan new recurring RecurringPeriodInput. recurring BOOLEAN Plan old and new recurring period RecurringPeriodInput. numberOfPeriods STRING Plan old recurringPeriod RecurringPeriodInput. numberOfPeriods STRING Plan new refundPolicy ProratingOptionsInput. refundPolicy STRING(NONE /FULL_REFUND /TIME_BASED) Plan old and new renewalGracePeriod InitialTemplateInstance. renewalGracePeriod STRING Plan old and new subscriptionPolicy ProratingOptionsInput. subscriptionPolicy STRING (NONE / TIME_BASED) Plan old and new purchase fee InitialTemplateInstance. purchaseFee NUMBER Plan old purchaseFee InitialTemplateInstance. purchaseFee NUMBER Plan new periodAllowance ManagedBalance. periodAllowance NUMBER Plan -Service new rollover ManagedBalance.rollover BOOLEAN Plan Service maxRolloverPeriods ManagedBalance. maxRolloverPeriods NUMBER Plan-Service new rolloverAllowance ManagedBalance. rolloverAllowance NUMBER Plan-Service new rolloverMaxAllowance ManagedBalance. rolloverMaxAllowance NUMBER Plan-Service new chargeNewBalanceFirst ManagedBalance. chargeNewBalanceFirst BOOLEAN Plan-Service new workingHours InitialTemplateServiceInput. workingHours JSON Plan-Service old and new"""
