"""The configurations for limiting a specific API. currentRate and averageRate may show high values as the cold start is at max."""
type ApiLimitsConfig {
  """API type including 4G/5G interface."""
  apiType: ApiType!
  """If true, API requests are rejected beyond the soft limit."""
  rejectRequestsOverSoftLimit: Boolean @deprecated(reason: "Use minLimit, maxLimit, burstPercentage, currentLimit, currentRate, and averageRate for the Rate Limiting Standalone component instead.")
  """The soft limit for the average number of transactions per second."""
  softLimitTps: Int @deprecated(reason: "Use minLimit, maxLimit, burstPercentage, currentLimit, currentRate, and averageRate for the Rate Limiting Standalone component instead.")
  """The hard limit for the average number of transactions per second."""
  hardLimitTps: Int @deprecated(reason: "Use minLimit, maxLimit, burstPercentage, currentLimit, currentRate, and averageRate for the Rate Limiting Standalone component instead.")
  """DateTime when the provider will no longer be over the soft limit."""
  overSoftLimitUntil: AWSDateTime @deprecated(reason: "Use minLimit, maxLimit, burstPercentage, currentLimit, currentRate, and averageRate instead.")
  """DateTime when the provider will no longer be over the hard limit."""
  overHardLimitUntil: AWSDateTime @deprecated(reason: "Use minLimit, maxLimit, burstPercentage, currentLimit, currentRate, and averageRate instead.")
  """Rate limit, in requests per second, allowed regardless of current average rate."""
  minLimit: Int!
  """Absolute maximum rate limit, in requests per second."""
  maxLimit: Int!
  """Percentage allowed to burst above average rate limit."""
  burstPercentage: Int!
  """Current limit being applied to requests; will be between minLimit and maxLimit."""
  currentLimit: Int!
  """Number of requests allowed in the last second."""
  currentRate: Int!
  """Average number of requests per second over the last 5 minutes."""
  averageRate: Float!
}

