apis:
- aid: totogi:totogi-charging-as-a-service
  name: Totogi Charging-as-a-Service API
  description: >-
    Totogi Charging-as-a-Service is a serverless, multi-tenant 5G Standalone and 5G Advanced
    converged charging system delivered as SaaS on AWS, with built-in policy control. Its
    account-management surface is a GraphQL API — served by AWS AppSync, region-pinned, and
    fully documented in public at docs.api.totogi.com — useful for querying balances and event
    data records, provisioning subscribers and devices, subscribing accounts to plans, and
    managing tenant configuration. The published contract carries 32 queries, 61 mutations and
    480 type definitions, and it is unusually explicit about runtime semantics: every operation
    states its authorized roles, every operation returns a result union whose members are the
    success payload plus each typed error it can raise (68 error types implementing a common
    Error interface with errorCode/errorMessage), mutations accept a caller-supplied
    transactionId to guarantee idempotency, RateLimitExceeded carries a retryAfter timestamp,
    and deprecated fields publish both a deprecated date and an expiration date. Access is
    OAuth 2.0 client-credentials only; there is no self-serve signup and no sandbox.
  humanURL: https://docs.api.totogi.com/
  baseURL: https://gql.produseast1.api.totogi.com/graphql
