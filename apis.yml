apis:
- aid: totogi:whoosh-programmable-messaging-api
  name: Whoosh Programmable Messaging API
  description: >-
    Whoosh! is Totogi's Application-to-Person (A2P) messaging API, launched
    in September 2023 and positioned as a drop-in replacement for Twilio's A2P APIs
    that network operators can resell to keep enterprise messaging traffic and revenue
    on their own network. The REST surface deliberately mirrors Twilio's 2010-04-01
    account/resource shape — POST to /2010-04-01/Accounts/{AccountSid}/Messages.json
    with To, From, and Body — and authenticates with HTTP Basic using an Account SID
    and Auth Token issued from the Whoosh console. Delivery status is pushed back
    via a StatusCallback webhook that POSTs on queued, failed, sent, delivered, and
    undelivered. Quickstart documentation is public and un-gated; the console that
    issues credentials is not, and there is no self-serve signup.
  humanURL: https://docs.whoosh.totogi.solutions
  baseURL: https://api.whoosh.totogi.solutions/2010-04-01/Accounts/
  tags:
