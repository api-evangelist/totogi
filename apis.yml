aid: totogi
url: https://raw.githubusercontent.com/api-evangelist/totogi/refs/heads/main/apis.yml
name: Totogi
kind: company
description: >-
  Totogi LLC is an Austin, Texas based vertical AI and BSS software vendor
  that builds telecom operator software natively on the public cloud (AWS). Its two
  products are the Totogi Ontology (formerly BSS Magic), a machine-readable semantic
  layer that sits above a carrier's existing BSS, OSS, core, and network systems so
  AI agents can reason and act across them, and Totogi Charging-as-a-Service, a
  multi-tenant, serverless 5G Standalone converged charging system with built-in
  policy control that integrates over the 4G/5G NSA Sy (PCRF) and 5G SA N28 (PCF)
  interfaces. Totogi sits in the telecom value chain as a vendor to communications
  service providers, MNOs, MVNOs, and MVNEs — it does not own spectrum and it does
  not sell to developers directly. Its API posture is split. Totogi holds TM Forum
  Platinum Open API Conformance Certification for 31 certified Open APIs and once
  ranked #1 on the TM Forum Open API Certification Leaderboard, but the platform's
  own API reference at docs.totogi.solutions is a Redocly login wall with no public
  specification, no self-serve signup, and no downloadable OpenAPI. The one genuinely
  public developer surface is Whoosh!, a Twilio-compatible A2P messaging API Totogi
  sells through operators rather than to developers, with open quickstart docs, a
  live API host, and four published helper libraries. No CAMARA, GSMA Open Gateway,
  or Aduna reference appears anywhere in Totogi's own canonical AI index.
