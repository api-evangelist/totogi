aid: totogi
url: https://raw.githubusercontent.com/api-evangelist/totogi/refs/heads/main/apis.yml
name: Totogi
kind: company
description: >-
  Totogi LLC is an Austin, Texas based vertical AI and BSS software vendor that builds
  telecom operator software natively on the public cloud (AWS). Its two products are the
  Totogi Ontology (formerly BSS Magic), a machine-readable semantic layer that sits above a
  carrier's existing BSS, OSS, core, and network systems so AI agents can reason and act
  across them, and Totogi Charging-as-a-Service, a multi-tenant, serverless 5G Standalone
  converged charging system with built-in policy control that integrates over the 4G/5G NSA
  Sy (PCRF), 5G SA N28 (PCF), Npcf_SMPolicyControl (N7) and Gx interfaces, and implements the
  3GPP TS 32.291 Nchf_ConvergedCharging v3 (N40) resource surface. Totogi sits in the telecom
  value chain as a vendor to communications service providers, MNOs, MVNOs, and MVNEs — it
  does not own spectrum and it does not sell to developers directly. Its API posture is split
  three ways. Charging-as-a-Service is a fully public GraphQL contract: a SpectaQL reference
  at docs.api.totogi.com publishes 32 queries, 61 mutations and 480 type definitions, with
  per-operation named authorization roles, typed result-union errors, caller-supplied
  transaction ids for idempotency, and dated field deprecations. Whoosh! is a Twilio-compatible
  A2P messaging API sold through operators, with open quickstarts, a live API host and four
  published helper libraries. The platform's other reference at docs.totogi.solutions is a
  Redocly login wall, and there is no self-serve signup anywhere. Totogi holds TM Forum
  Platinum Open API Conformance Certification for 31 certified Open APIs and once ranked #1 on
  the TM Forum Open API Certification Leaderboard. No CAMARA, GSMA Open Gateway, or Aduna
  reference appears anywhere in Totogi's own canonical AI index.
