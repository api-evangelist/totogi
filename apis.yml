- aid: totogi:totogi-charging-as-a-service
  name: Totogi Charging-as-a-Service
  description: >-
    Totogi Charging-as-a-Service is a serverless, multi-tenant 5G Standalone
    and 5G Advanced converged charging system delivered as SaaS on AWS, with built-in
    policy control and a single account management API across tenants. It integrates
    with external policy management over the 4G/5G NSA Sy (PCRF) and 5G SA N28 (PCF)
    interfaces, and Totogi's BSS surface is built on TM Forum Open APIs, for which
    Totogi holds Platinum Conformance Certification across 31 certified Open APIs.
    The product's API reference is published on a Redocly-hosted portal at
    docs.totogi.solutions that returns a "Log in with Redocly" wall to anonymous
    visitors — no specification, endpoint list, or base URL is publicly retrievable,
    and access is arranged through a sales demo. Listed here as a real, named,
    documented-behind-a-wall API product, not as a public developer surface.
  humanURL: https://totogi.com/ai-native-charging/
