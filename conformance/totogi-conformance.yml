note: >-
  Totogi's standards posture is entirely TM Forum and 3GPP. It holds a real, attested TM Forum
  certification and implements named 3GPP service-based interfaces. It conforms to none of the
  web-API conventions the rest of the catalog is measured against — no OpenAPI, no RFC 9457,
  no OIDC discovery — because its public contract is GraphQL.
